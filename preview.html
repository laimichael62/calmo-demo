<!DOCTYPE html><html lang="zh-Hant-MO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CALMO · 裝置預覽</title>
<style>body{margin:0;background:#D8C8B0 radial-gradient(circle at 30% 20%,#E6DACA,#C9B79E);font-family:"Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif;color:#2A2826;min-height:100vh}
h1{letter-spacing:.4em;font-weight:500;text-align:center;margin:26px 0 4px}p{text-align:center;margin:0 0 20px;color:#6F5E4B;font-size:14px}
.row{display:flex;gap:40px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:0 20px 40px}

.ipad{width:calc(1180px*.62 + 36px);height:calc(820px*.62 + 36px);background:#1d1c1b;border-radius:34px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.3)}

.scr{width:100%;height:100%;overflow:hidden;border-radius:18px;background:#F1EDE6}.iphone .scr{border-radius:34px}

</style></head><body>
