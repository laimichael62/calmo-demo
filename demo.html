<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CALMO POS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>CALMO · 店員點餐 Demo (HALOS 智日科技)</title>
<style>
:root{--paper:#F1EDE6;--card:#FBF9F5;--ink:#2A2826;--mute:#8C857C;--line:#DDD5C9;--wood:#D8C8B0;--wood2:#C4B095;--accent:#6F5E4B;--ok:#5E7A5A;--warn:#B5693B;--bad:#A94436;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{font-family:"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--wood);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{position:absolute;inset:10px;background:var(--paper);border-radius:18px;display:grid;grid-template-columns:84px 1fr;overflow:hidden;box-shadow:0 0 0 6px var(--wood2) inset,0 8px 30px rgba(0,0,0,.15)}
.rail{background:#2A2826;color:#E9E2D6;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px}
.logo{font-weight:600;letter-spacing:.32em;font-size:13px;margin:4px 0 14px 5px}
.rail button{width:68px;padding:9px 0;border-radius:12px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.65}
.rail button.on{background:#47423C;opacity:1}.rail svg{width:21px;height:21px}
.main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
.wm{position:absolute;right:-60px;bottom:-80px;font:italic 520px/1 "Snell Roundhand","Brush Script MT",cursive;color:rgba(170,150,130,.12);pointer-events:none;user-select:none}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:26px}.brand{letter-spacing:.35em;font-weight:500}
#v-order.on{display:grid;grid-template-columns:180px 1fr 350px;width:100%}
.cats{border-right:1px solid var(--line);padding:18px 10px;overflow:auto}
.cats .h{font-size:22px;padding:0 10px 14px}.cats button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;margin-bottom:4px;font-size:14px;line-height:1.25}
.cats button small{display:block;color:var(--mute);font-size:11px}
.cats button.on{background:var(--ink);color:#fff}.cats button.on small{color:#cfc6b8}
.menu{overflow:auto;padding:18px 20px 40px;position:relative}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.search{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:10px 16px;font:inherit}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:30px;font-size:12px;background:var(--card);white-space:nowrap}
.promo-banner{background:var(--ink);color:#F1EDE6;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.promo-banner b{letter-spacing:.1em}
.sech{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink);padding:14px 0 6px;margin-bottom:10px}
.sech h2{font-size:18px}.sech span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.item:active{transform:scale(.97)}.item:hover{border-color:var(--wood2)}
.item b{font-size:15px}.item i{font-style:normal;color:var(--mute);font-size:12px;display:block;margin-top:2px}
.price{font-variant-numeric:tabular-nums;font-size:14px;margin-top:10px;display:flex;justify-content:space-between;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#E8DFD1;color:var(--accent);white-space:nowrap}
.tag.dark{background:var(--ink);color:#fff}.tag.green{background:#DDE6D8;color:var(--ok)}
.cart{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.cart .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--paper);border-radius:20px;padding:3px;flex-wrap:wrap}.seg button{padding:5px 10px;border-radius:16px;font-size:12px}.seg button.on{background:var(--ink);color:#fff}
.mem{margin:10px 16px 0;padding:9px 12px;border:1px dashed var(--wood2);border-radius:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lines{flex:1;overflow:auto;padding:4px 16px}
.line{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px}
.line .mods{color:var(--mute);font-size:12px}
.line .pr{text-align:right}.line s{color:var(--mute);font-size:12px;display:block}
.promo-row{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;background:#EEF2EA;border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ok);margin-top:4px}
.promo-row.off{background:#F3EEE6;color:var(--mute)}
.sw{position:relative;width:34px;height:20px;border-radius:12px;background:#CFC6B8;flex:none}.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:16px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff}
.empty{color:var(--mute);text-align:center;margin-top:50px;font-size:14px}
.tot{padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.tot div{display:flex;justify-content:space-between;margin:3px 0}.tot .g{font-size:22px;font-weight:600;margin-top:6px}
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:13px;font-size:15px;width:100%;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}.btn:disabled{opacity:.35}
.btn.sm{white-space:nowrap;padding:7px 12px;width:auto;font-size:13px;border-radius:10px}
.pays{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px 8px}.pays .btn{padding:11px 4px;font-size:13px}
.pays .wide{grid-column:1/4}
.mask{position:fixed;inset:0;background:rgba(42,40,38,.45);display:none;align-items:center;justify-content:center;z-index:30}
.mask.on{display:flex}
.modal{background:var(--paper);border-radius:20px;width:min(620px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{padding:20px 24px 12px;border-bottom:1px solid var(--line);position:relative}
.modal .mh p{margin:6px 0 0;color:var(--mute);font-size:13px}
.x{position:absolute;right:16px;top:14px;font-size:24px;color:var(--mute)}
.mb{padding:8px 24px;overflow:auto}
.grp{margin:14px 0}.grp .gt{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;margin-bottom:8px}
.req{font-size:10px;font-weight:500;padding:2px 6px;border-radius:6px;background:var(--warn);color:#fff}.opt{background:#E0D8CC;color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.o{padding:9px 14px;border-radius:24px;border:1px solid var(--line);background:var(--card);font-size:13px}
.o.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.note{font-size:11.5px;color:var(--mute)}
.page{flex:1;overflow:auto;padding:22px 26px 40px;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:13px}
.ticket.void{opacity:.5}
.ticket h3{font-size:16px;display:flex;justify-content:space-between;align-items:center}
.st{font-size:11px;padding:3px 9px;border-radius:10px;background:#E8DFD1}.st.new{background:var(--warn);color:#fff}.st.ready{background:var(--ok);color:#fff}
.ticket ul{padding-left:16px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--mute);font-size:12px;background:#EEE8DE}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.sum td{font-weight:600;background:#F4EFE7}
.tw{overflow-x:auto;border-radius:var(--r);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}.kpi b{font-size:21px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mute);font-size:11px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{font-size:15px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.var{font-size:20px;font-weight:600}.var.ok{color:var(--ok)}.var.bad{color:var(--bad)}
.check{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.check.ok{background:#DDE6D8;color:#3E5A3A}.check.bad{background:#F2D9D3;color:var(--bad)}
.eq{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.eq .kpi{flex:1;min-width:120px}.eq .op{align-self:center;font-size:22px;color:var(--mute)}
.ex{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:var(--warn);color:#fff;vertical-align:middle;margin-left:6px;font-weight:500}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tier{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);text-align:center}
.tier.on{border:2px solid var(--ink)}.tier b{font-size:19px;display:block}.tier span{font-size:12px;color:var(--ok)}
input.f{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;width:100%}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.keypad button{padding:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:18px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1}
/* ===== v3 快速點餐 ===== */
.app{grid-template-columns:1fr!important}
#v-order.on{display:grid!important;grid-template-columns:1fr 372px;width:100%}
.ord{display:flex;flex-direction:column;min-width:0;min-height:0}
.obar{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.obar .brand{font-size:17px;margin-right:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:48px;padding:0 18px;border-radius:24px;font-size:15px;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff}
.icon{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);background:var(--card)}
.icon svg{width:22px;height:22px}
.tiles{flex:1;overflow:auto;padding:6px 18px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;align-content:start}
.tile{padding:0;font:inherit;color:inherit;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:104px;display:flex;flex-direction:column;overflow:hidden;text-align:left;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tile .tn{font-size:16px;font-weight:600;padding:14px 14px 0;line-height:1.3;flex:1}
.tile .tp{padding:0 14px 14px;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.tile:active,.half:active{background:#ECE5DA}
.halves{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);min-height:52px}
.half{font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px}
.half+.half{border-left:1px solid var(--line)}.half b{font-weight:600}
.half.ice b{color:#4F6B80}
.flash{animation:fl .35s}@keyframes fl{0%{box-shadow:0 0 0 3px var(--ink)}100%{box-shadow:0 0 0 0 transparent}}
.badge{position:absolute;right:10px;top:10px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.cart{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.chd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.chd h3{font-size:18px}
.lines{flex:1;overflow:auto;padding:0 10px}
.cl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer}
.cl:active{background:#F1EBE2}
.cl .nm{font-size:15px;font-weight:500}.cl .md{font-size:12.5px;color:var(--mute);margin-top:2px}
.cl .pt{font-size:12.5px;color:var(--ok);margin-top:3px}
.cl .rt{display:flex;align-items:center;gap:10px}
.cl .am{min-width:64px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:24px;background:#fff}
.stp button{width:44px;height:44px;font-size:20px;color:var(--ink)}.stp span{min-width:18px;text-align:center;font-size:15px}
.ctot{padding:12px 18px 6px;font-size:14px;color:var(--mute)}
.ctot div{display:flex;justify-content:space-between;margin:2px 0}
.big{margin:8px 16px 16px;min-height:64px;border-radius:16px;background:var(--ink);color:#fff;font-size:19px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:500}
.big:disabled{opacity:.3}
.sheetm{position:fixed;inset:0;background:rgba(42,40,38,.4);display:none;z-index:30;align-items:flex-end;justify-content:center}
.sheetm.on{display:flex}
.sheet{background:var(--paper);width:min(640px,100vw);border-radius:22px 22px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{font-size:21px}
.cg{margin:14px 0}.cg .gl{font-size:13px;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{min-height:52px;min-width:88px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
.chp small{color:var(--mute);font-size:13px;margin-left:4px}
.chp.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chp.on small{color:#cfc6b8}
.srow{display:flex;gap:10px;align-items:center;margin-top:18px}
.srow .big{margin:0;flex:1}
.txt{min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);font-size:15px;background:var(--card)}
.ptg{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:15px}
.ptg .sw{width:46px;height:28px;border-radius:14px}.ptg .sw::after{width:24px;height:24px}.ptg .sw.on::after{left:20px}
.co{position:fixed;inset:0;background:var(--paper);z-index:28;display:none;grid-template-columns:1fr 1.1fr}
.co.on{display:grid}
.co .l{padding:28px;border-right:1px solid var(--line);overflow:auto;background:var(--card)}
.co .r{padding:28px 32px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.co .due{font-size:46px;font-weight:600;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbtn{min-height:96px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pbtn small{font-size:13px;color:var(--mute);font-weight:400}
.pbtn:active{background:var(--ink);color:#fff}.pbtn:disabled{opacity:.35}
.pbtn.wal{grid-column:1/3;background:var(--ink);color:#fff}.pbtn.wal small{color:#cfc6b8}
.memrow{display:flex;gap:10px}.memrow input{flex:1;min-width:0;font-size:20px;letter-spacing:.08em}
.sumrow{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;border-bottom:1px solid var(--line)}
.menu-list button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 6px;font-size:16px;border-bottom:1px solid var(--line)}
.backbtn{position:fixed;left:16px;bottom:16px;z-index:20;min-height:48px;padding:0 20px;border-radius:24px;background:var(--ink);color:#fff;font-size:15px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.backbtn.on{display:block}
.cartbar{display:none}
.ttl{display:none}
@media (max-width:820px){
 body{background:var(--paper)}
 .app{inset:0;border-radius:0;box-shadow:none}
 #v-order.on{grid-template-columns:1fr}
 .obar{padding:10px 12px 6px;gap:8px;flex-wrap:wrap}.obar .brand{display:none}
 .tabs{order:3;flex-basis:100%}
 .ttl{display:block;flex:1;font-size:16px;letter-spacing:.3em;font-weight:500}
 .tiles{grid-template-columns:1fr 1fr;padding:6px 12px 96px;gap:10px}
 .cart{position:fixed;left:0;right:0;bottom:0;top:10%;z-index:25;border-radius:22px 22px 0 0;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 40px rgba(0,0,0,.2);border:0}
 .cart.open{transform:none}
 .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;background:var(--ink);color:#fff;border-radius:16px;min-height:60px;padding:0 18px;justify-content:space-between;align-items:center;font-size:16px}
 .closecart{display:flex!important}
 .co{grid-template-columns:1fr;overflow:auto}.co .l{border:0;padding:18px 18px 6px}.co .r{padding:10px 18px 24px}.co .due{font-size:36px}
 .page{padding:16px 14px 80px}h1{font-size:22px}
 .cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topgrid{grid-template-columns:1fr!important}
 .eq .op{display:none}.eq .kpi{min-width:45%}th,td{padding:8px;font-size:12.5px}.wm{font-size:300px}
}
.closecart{display:none}

</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="wm">C</div>
    <section class="view on" id="v-order">
      <div class="ord">
        <div class="obar"><span class="brand">CALMO</span><span class="ttl">CALMO</span>
          <div class="tabs" id="cats"></div>
          <button class="icon" id="moreBtn" aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
        <div class="tiles" id="menu"></div>
      </div>
      <aside class="cart" id="cart">
        <div class="chd"><h3>訂單 <span id="ono" class="note"></span></h3>
          <div style="display:flex;gap:8px;align-items:center"><div class="seg" id="otype"><button class="on" data-t="dine">堂食</button><button data-t="take">外賣</button></div>
          <button class="icon closecart" onclick="cartOpen(false)">×</button></div></div>
        <div class="lines" id="lines"></div>
        <div class="ctot" id="tot"></div>
        <button class="big" id="checkout"><span>結帳</span><b id="dueBtn"></b></button>
      </aside>
      <button class="cartbar" id="cartbar" onclick="cartOpen(true)"><span id="cbl">訂單</span><b id="cbt"></b></button>

function walletSpend(mem,amt,ref,date){const bal=mem.p+mem.b;if(amt>bal)return null;let bp=bal?Math.round(amt*mem.b/bal):0;bp=Math.min(bp,mem.b);let pp=amt-bp;if(pp>mem.p){pp=mem.p;bp=amt-pp}

/* ======================= 月結儲值負債表 ======================= */
function monthlyData(day){const mk=mkey(day);const start=new Date(day.getFullYear(),day.getMonth(),1);
 const before=S.ledger.filter(l=>l.date<start),inM=S.ledger.filter(l=>mkey(l.date)==mk&&l.date>=start);
 const sum=(arr,f,k)=>arr.filter(f).reduce((a,l)=>a+l[k],0);
 const P={open:sum(before,()=>1,'dp'),top:sum(inM,l=>l.type=='充值','dp'),spend:-sum(inM,l=>l.type=='消費','dp'),refund:sum(inM,l=>l.type=='退款','dp'),adj:sum(inM,l=>l.type=='調整','dp')};
 const B={open:sum(before,()=>1,'db'),top:sum(inM,l=>l.type=='贈送','db'),spend:-sum(inM,l=>l.type=='消費','db'),refund:sum(inM,l=>l.type=='退款','db'),adj:sum(inM,l=>l.type=='調整','db')};
 P.close=P.open+P.top-P.spend+P.refund+P.adj;B.close=B.open+B.top-B.spend+B.refund+B.adj;
 const memSumP=S.members.reduce((a,x)=>a+x.p,0),memSumB=S.members.reduce((a,x)=>a+x.b,0);
 const per=S.members.map(x=>{const f=l=>l.mid==x.id;const op=sum(before,f,'dp');const t=sum(inM,l=>f(l)&&l.type=='充值','dp');const s=-sum(inM,l=>f(l)&&l.type=='消費','dp');const o=sum(inM,l=>f(l)&&(l.type=='退款'||l.type=='調整'),'dp');return {x,op,t,s,o,cl:op+t-s+o}});
 return {mk,P,B,memSumP,memSumB,per,revenue:P.spend-P.refund,bonusDisc:B.spend-B.refund}}

 $('#monthlyPage').innerHTML=`<div class="ph"><div><h1>月結儲值負債表 <span class="ex">示例</span></h1><div class="note">${M.mk} · 截至 ${tlabel(new Date())} · 含本次 Demo 操作</div></div><button class="btn sm ghost" onclick="window.print()">列印／匯出</button></div>

 <h3 style="margin:0 0 8px">本金（儲值負債）</h3>
 <div class="eq">${k('期初餘額',P.open)}<span class="op">＋</span>${k('本月充值本金',P.top)}<span class="op">−</span>${k('本月消費（本金部分）',P.spend,'= 確認收入')}<span class="op">±</span>${k('退款回存／調整',P.refund+P.adj)}<span class="op">＝</span>${k('期末餘額（負債）',P.close)}</div>
 <div class="two">
  <div class="box"><h3>收入確認</h3>
   <div class="kv"><span>儲值消費總額</span><span>${fmt(P.spend+B.spend-P.refund-B.refund)}</span></div>
   <div class="kv"><span>本金部分 → <b>本月確認收入</b></span><b>${fmt(M.revenue)}</b></div>
   <div class="kv"><span>贈送部分 → 銷售折扣（不產生收入）</span><span>${fmt(M.bonusDisc)}</span></div>
   <div class="kv"><span>本月新增負債（充值本金）</span><span>${fmt(P.top)}</span></div></div>
  <div class="box"><h3>贈送額（另冊備查，非負債）</h3>
   <div class="kv"><span>期初</span><span>${fmt(B.open)}</span></div><div class="kv"><span>＋ 本月贈送</span><span>${fmt(B.top)}</span></div>
   <div class="kv"><span>− 本月使用</span><span>${fmt(B.spend)}</span></div><div class="kv"><span>± 退回／調整</span><span>${fmt(B.refund+B.adj)}</span></div>
   <div class="kv"><b>期末未用贈送</b><b>${fmt(B.close)}</b></div></div>
 </div>
 <h3 style="margin:18px 0 8px">會員明細（本金）</h3>
 <div class="tw"><table><thead><tr><th>會員</th><th class="n">期初</th><th class="n">充值</th><th class="n">消費</th><th class="n">退款/調整</th><th class="n">期末</th><th class="n">系統餘額</th><th></th></tr></thead><tbody>
 ${M.per.map(r=>`<tr><td>${r.x.name}<div class="note">${r.x.phone}</div></td><td class="n">${fmt(r.op)}</td><td class="n">${fmt(r.t)}</td><td class="n">${fmt(r.s)}</td><td class="n">${fmt(r.o)}</td><td class="n"><b>${fmt(r.cl)}</b></td><td class="n">${fmt(r.x.p)}</td><td>${r.cl==r.x.p?'<span class="tag green">✓</span>':'<span class="tag" style="background:#F2D9D3;color:var(--bad)">✗</span>'}</td></tr>`).join('')}
 <tr class="sum"><td>合計</td><td class="n">${fmt(P.open)}</td><td class="n">${fmt(P.top)}</td><td class="n">${fmt(P.spend)}</td><td class="n">${fmt(P.refund+P.adj)}</td><td class="n">${fmt(P.close)}</td><td class="n">${fmt(M.memSumP)}</td><td></td></tr></tbody></table></div>
 <div class="box"><h3>備註（須會計師確認）</h3><p class="note" style="font-size:13px;line-height:1.7;margin:0">
 1. 充值本金於收款時記「合約負債／預收款項」，不屬收入；消費時按本金部分轉為收入。<br>
 2. 贈送額不入負債；消費時按「本金：贈送」餘額比例分攤，贈送部分列為銷售折扣。<br>
 3. 長期未使用餘額（breakage）是否及何時確認為收入、是否須設有效期，涉及《消費者權益保護法》及稅務處理，<b>須會計師／律師確認</b>；本表暫不作 breakage 確認。<br>
 4. 本表由只增不改的流水帳推導；每月結帳後鎖定期間，調整須以新流水入帳並註明原因。</p></div>`}
